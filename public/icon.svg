<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <!-- 拉丝银金属底:垂直线性渐变 -->
    <linearGradient id="silver" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f7f8f9"/>
      <stop offset="100%" stop-color="#d4d7da"/>
    </linearGradient>
    <!-- 105° 方向斜向高亮带 -->
    <linearGradient id="sheen" x1="0" y1="1" x2="0.259" y2="0.034">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="45%" stop-color="#ffffff" stop-opacity="0.35"/>
      <stop offset="55%" stop-color="#ffffff" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <!-- 水平细线纹理,模拟拉丝 -->
    <pattern id="brushed" width="8" height="4" patternUnits="userSpaceOnUse">
      <line x1="0" y1="1" x2="8" y2="1" stroke="#ffffff" stroke-width="0.6" opacity="0.25"/>
      <line x1="0" y1="3" x2="8" y2="3" stroke="#9aa0a5" stroke-width="0.5" opacity="0.18"/>
    </pattern>
  </defs>

  <!-- 机身底色:银色渐变 + 高亮带 + 拉丝纹理 -->
  <rect width="512" height="512" rx="96" fill="url(#silver)"/>
  <rect width="512" height="512" rx="96" fill="url(#sheen)"/>
  <rect width="512" height="512" rx="96" fill="url(#brushed)"/>

  <!-- V-A 情绪象限(区域 x:96-416 / y:96-416,底部留字标空间) -->
  <!-- 象限暖色 tint:橙灰交替,极淡 -->
  <rect x="96" y="96" width="160" height="160" fill="#8b8f94" opacity="0.08"/>
  <rect x="256" y="96" width="160" height="160" fill="#d4783b" opacity="0.12"/>
  <rect x="96" y="256" width="160" height="160" fill="#d4783b" opacity="0.10"/>
  <rect x="256" y="256" width="160" height="160" fill="#8b8f94" opacity="0.08"/>
  <!-- 十字轴线 -->
  <line x1="96" y1="256" x2="416" y2="256" stroke="#b9bdc1" stroke-width="3"/>
  <line x1="256" y1="96" x2="256" y2="416" stroke="#b9bdc1" stroke-width="3"/>
  <!-- 象限标签 -->
  <text x="176" y="170" text-anchor="middle" font-family="'Noto Serif SC', serif" font-size="26" fill="#6b7076">高警觉</text>
  <text x="336" y="170" text-anchor="middle" font-family="'Noto Serif SC', serif" font-size="26" fill="#6b7076">高唤起</text>
  <text x="176" y="300" text-anchor="middle" font-family="'Noto Serif SC', serif" font-size="26" fill="#6b7076">低唤起</text>
  <text x="336" y="310" text-anchor="middle" font-family="'Noto Serif SC', serif" font-size="26" fill="#6b7076">低警觉</text>

  <!-- 橙色圆点:左下与右下象限 -->
  <circle cx="170" cy="330" r="20" fill="#f5a623" stroke="#ffffff" stroke-width="6"/>
  <circle cx="340" cy="360" r="26" fill="#f5a623" stroke="#ffffff" stroke-width="6"/>

  <!-- 底部字标 -->
  <text x="256" y="470" text-anchor="middle" font-family="Georgia, 'Noto Serif SC', serif" font-style="italic" font-size="44" fill="#4a4e52">Momentune</text>
</svg>
